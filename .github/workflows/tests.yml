name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # only the lightweight deps the unit tests touch; the embedding model and
      # vector DB are faked in tests/conftest.py
      - run: pip install pytest pymupdf openai python-dotenv
      - run: pytest -q
